<form [formGroup]="loginFormInfo" (ngSubmit)="login()">
    <div class="field">
      <label for="">email</label>
      <input type="email" formControlName="email">
    </div>
    <div class="field">
      <label for="">Password</label>
      <input type="text" formControlName="password">
    </div>
    <button type="submit">LOGIN</button>
  </form>
