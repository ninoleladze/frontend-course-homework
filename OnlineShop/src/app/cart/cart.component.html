<div class="cart-section container mt-4">
  <table class="table table-bordered table-hover text-center">
    <thead class="table-danger">
      <tr>
        
        <th>Price</th>
        <th>Quantity</th>
        <th>Total</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of cart">
        
        <td>{{ item.product.name }}</td>
        <td>{{ item.product.price}}</td>
        <td>
          <div class="d-flex justify-content-center align-items-center gap-2">
            <button class="btn btn-warning btn-sm" (click)="change(item.productId, item.quantity - 1)">
              <i class="fas fa-minus"></i>
            </button>
            <span class="fw-bold">{{ item.quantity }}</span>
            <button class="btn btn-success btn-sm" (click)="change(item.productId, item.quantity + 1)">
              <i class="fas fa-plus"></i>
            </button>
          </div>
        </td>
        <td>{{ item.product.price * item.quantity }}</td>
        <td>
          <button class="btn btn-danger btn-sm" (click)="deleteItem(item.product.id)">
            <i class="fas fa-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="cart.length === 0" class="alert alert-warning text-center mt-4">
    <i class="fas fa-exclamation-circle"></i> Your cart is empty.
  </div>

  <div *ngIf="cart.length > 0" class="text-end me-3 mt-3">
    <h5>Total Amount: {{ getTotal()  }}</h5>
  </div>
</div>


<app-footer></app-footer>
