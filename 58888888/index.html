<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="ome.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">Online Store</a>
            
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search products...">
                <button id="search-button"><i class="fas fa-search"></i></button>
            </div>
            
            <div class="header-right">
                <div class="auth-links" id="auth-container">
                    <a href="#" id="login-btn">Login</a>
                    <a href="#" id="register-btn">Register</a>
                </div>
                
                <a href="pages/cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="content-wrapper">
                <aside class="filter-sidebar">
                    <h3>Filters</h3>
                    
                    <div class="filter-section">
                        <h4>Category</h4>
                        <select id="category-filter">
                            <option value="">All Categories</option>
                        </select>
                    </div>
                    
                    <div class="filter-section">
                        <h4>Brand</h4>
                        <select id="brand-filter">
                            <option value="">All Brands</option>
                        </select>
                    </div>
                    
                    <div class="filter-section">
                        <h4>Price Range</h4>
                        <div class="price-inputs">
                            <input type="number" id="min-price" placeholder="Min">
                            <span>to</span>
                            <input type="number" id="max-price" placeholder="Max">
                        </div>
                        <button id="apply-price">Apply</button>
                    </div>
                    
                    <div class="filter-section">
                        <h4>Rating</h4>
                        <div class="rating-slider">
                            <input type="range" id="rating-filter" min="0" max="5" step="1" value="0">
                            <div class="rating-value" id="rating-value">Any rating</div>
                        </div>
                    </div>
                </aside>
                
                <div class="products-container">
                    <div class="products-grid" id="products-grid"></div>
                    
                    <div id="loading" class="loading">
                        <div class="spinner"></div>
                        <p>Loading products...</p>
                    </div>
                    
                    <div id="no-products" class="no-products" style="display: none;">
                        <p>No products found matching your criteria.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <div class="form-error" id="login-error"></div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
        </div>
    </div>

    <div id="register-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Register</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="register-name">Full Name</label>
                    <input type="text" id="register-name" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" required>
                </div>
                <div class="form-error" id="register-error"></div>
                <button type="submit" class="btn-primary">Register</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2023 Online Store. All rights reserved.</p>
        </div>
    </footer>

    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script src="cart.js"></script>
    <script src="products.js"></script>
    <script src="app.js"></script>
</body>
</html>
