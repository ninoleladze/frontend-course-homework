<section class="fairy-projects">
  <div class="container">
    <h2 class="section-title">Magical Creations</h2>
    
    <div class="projects-filter">
      <button 
        *ngFor="let category of categories" 
        class="filter-btn"
        [class.active]="selectedCategory === category"
        (click)="filterProjects(category)">
        {{ category | titlecase }}
      </button>
    </div>
    
    <div class="projects-grid">
      <div class="project-card" *ngFor="let project of filteredProjects">
        <div class="project-image">
          <img [src]="project.image" [alt]="project.title">
          <div class="project-overlay">
            <div class="project-links">
              <a [href]="project.liveUrl" target="_blank" *ngIf="project.liveUrl" class="project-link">
                <i class="fas fa-external-link-alt"></i>
              </a>
              <a [href]="project.githubUrl" target="_blank" *ngIf="project.githubUrl" class="project-link">
                <i class="fab fa-github"></i>
              </a>
            </div>
          </div>
        </div>
        <div class="project-info">
          <h3>{{ project.title }}</h3>
          <p>{{ project.description }}</p>
          <div class="project-tech">
            <span *ngFor="let tech of project.technologies">{{ tech }}</span>
          </div>
        </div>
        <div class="project-sparkles">
          <div class="sparkle s1"></div>
          <div class="sparkle s2"></div>
          <div class="sparkle s3"></div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Magical floating elements -->
  <div class="floating-elements">
    <div class="floating-element e1"><i class="fas fa-code"></i></div>
    <div class="floating-element e2"><i class="fas fa-paint-brush"></i></div>
    <div class="floating-element e3"><i class="fas fa-laptop-code"></i></div>
    <div class="floating-element e4"><i class="fas fa-star"></i></div>
  </div>
</section>
