<form [formGroup]="formInfo" (ngSubmit)="register()" class="signup-form">
  <h2 class="form-title">Sign Up</h2>
  <div class="field">
    <label for="firstName">First Name</label>
    <input type="text" formControlName="firstName" id="firstName">
    <small class="error-msg" *ngIf="formInfo.get('firstName')?.invalid && formInfo.get('firstName')?.touched">
      First name is required.
    </small>
  </div>
  <div class="field">
    <label for="lastName">Last Name</label>
    <input type="text" formControlName="lastName" id="lastName">
    <small class="error-msg" *ngIf="formInfo.get('lastName')?.invalid && formInfo.get('lastName')?.touched">
      Last name is required.
    </small>
  </div>
  <div class="field">
    <label for="age">Age</label>
    <input type="number" formControlName="age" id="age">
    <small class="error-msg" *ngIf="formInfo.get('age')?.invalid && formInfo.get('age')?.touched">
      Age is required.
    </small>
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input type="email" formControlName="email" id="email">
    <small class="error-msg" *ngIf="formInfo.get('email')?.invalid && formInfo.get('email')?.touched">
      Please enter a valid email address.
    </small>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" formControlName="password" id="password">
    <small class="error-msg" *ngIf="formInfo.get('password')?.invalid && formInfo.get('password')?.touched">
      Password must be at least 6 characters.
    </small>
  </div>
  <div class="field">
    <label for="phone">Phone</label>
    <input type="text" formControlName="phone" id="phone">
  </div>
  <div class="field">
    <label for="address">Address</label>
    <input type="text" formControlName="address" id="address">
  </div>
  <div class="field">
    <label for="zipcode">ZIP</label>
    <input type="text" formControlName="zipcode" id="zipcode">
  </div>
  <div class="field">
    <label for="avatar">Avatar</label>
    <input type="text" formControlName="avatar" id="avatar">
  </div>
  <div class="field">
    <label for="gender">Gender</label>
    <select formControlName="gender" id="gender">
      <option value="">Choose a gender</option>
      <option value="MALE">Male</option>
      <option value="FEMALE">Female</option>
      <option value="OTHER">Other</option>
    </select>
    <small class="error-msg" *ngIf="formInfo.get('gender')?.invalid && formInfo.get('gender')?.touched">
      Please select a gender.
    </small>
  </div>
  <button type="submit" class="btn-signup" [disabled]="formInfo.invalid">Register</button>
</form>
