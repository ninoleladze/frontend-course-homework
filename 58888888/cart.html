<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Online Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="../index.html" class="logo">Online Store</a>
            
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search products...">
                <button id="search-button"><i class="fas fa-search"></i></button>
            </div>
            
            <div class="header-right">
                <div class="auth-links" id="auth-container">
                    <a href="#" id="login-btn">Login</a>
                    <a href="#" id="register-btn">Register</a>
                </div>
                
                <a href="cart.html" class="cart-icon active">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <h1>Your Shopping Cart</h1>
            
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Loading cart...</p>
            </div>
            
            <div id="empty-cart" class="empty-cart" style="display: none;">
                <p>Your cart is empty.</p>
                <a href="../index.html" class="continue-shopping-btn">Continue Shopping</a>
            </div>
            
            <div id="cart-content" class="cart-content" style="display: none;">
                <div id="cart-items" class="cart-items"></div>
                
                <div class="cart-summary">
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Shipping:</span>
                        <span>Free</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="total">$0.00</span>
                    </div>
                    
                    <button id="checkout-btn" class="checkout-btn">
                        Proceed to Checkout
                    </button>
                    
                    <a href="../index.html" class="continue-shopping-link">
                        Continue Shopping
                    </a>
                </div>
            </div>
        </div>
    </main>

    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <div class="form-error" id="login-error"></div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
        </div>
    </div>

    <div id="register-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Register</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="register-name">Full Name</label>
                    <input type="text" id="register-name" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" required>
                </div>
                <div class="form-error" id="register-error"></div>
                <button type="submit" class="btn-primary">Register</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2023 Online Store. All rights reserved.</p>
        </div>
    </footer>

    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script src="cart.js"></script>
    <script src="cart-page.js"></script>
</body>
</html>
