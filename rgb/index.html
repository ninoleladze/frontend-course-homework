<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB Color Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>The RGB Color Guessing Game</h1>
        <h2 id="colorDisplay">RGB(0, 0, 0)</h2>
    </header>
    <div id="controls">
        <button id="newColors">New Colors</button>
        <button id="easyMode">Easy</button>
        <button id="hardMode">Hard</button>
    </div>
    <div id="container">
        <!-- Color squares will be dynamically added here -->
    </div>
    <script src="app.js"></script>
</body>
</html>
